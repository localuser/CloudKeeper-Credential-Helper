[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ck-creds"
version = "0.1.0"
description = "AWS SAML credential helper with M365 SSO"
requires-python = ">=3.9"
dependencies = [
    "msal>=1.28",
    "boto3>=1.34",
    "requests>=2.31",
    "lxml>=5.0",
    "click>=8.1",
    "rich>=13.0",
    "keyring>=24.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock>=3.12", "responses>=0.25"]
browser = ["playwright>=1.40"]

[project.scripts]
ck-creds = "cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*"]
